<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prší – U Zeleného stolu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:Georgia,"Times New Roman",serif;color:#f5e6c4;overflow:hidden;user-select:none;
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:
   radial-gradient(ellipse at 50% 8%,rgba(255,200,110,.38),rgba(0,0,0,0) 55%),
   radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.75),rgba(0,0,0,0) 60%),
   repeating-linear-gradient(90deg,#5a3418 0 38px,#633a1b 38px 41px,#55301566 41px 80px),
   linear-gradient(#4a2a12,#3a200d);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.02) 2px 5px);}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  background:linear-gradient(#2a160a,#2a160a00);z-index:6;}
.sign{font-weight:700;font-size:17px;letter-spacing:1px;color:#f3d48a;text-shadow:0 0 8px rgba(255,190,80,.6),0 2px 2px #000;}
.sign small{display:block;font-size:10px;letter-spacing:3px;opacity:.75;}
.btn{font-family:inherit;background:linear-gradient(#f2d68a,#c99632);color:#3a2300;border:none;border-radius:10px;
  padding:8px 13px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #8d6418,0 5px 10px rgba(0,0,0,.5);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d6418;}
.scene{position:relative;flex:1 1 auto;perspective:1000px;}
.felt{position:absolute;left:4%;right:4%;top:2%;bottom:1%;border-radius:46% 46% 40% 40%/22% 22% 18% 18%;
  background:radial-gradient(ellipse at 50% 40%,#2f7a46,#174a2a 70%,#0f3a20);
  box-shadow:inset 0 0 40px rgba(0,0,0,.7),0 0 0 8px #3b2210,0 0 0 11px #6d4420,0 12px 30px rgba(0,0,0,.7);
  transform:rotateX(14deg);transform-origin:50% 100%;}
.felt::after{content:"";position:absolute;inset:14px;border-radius:inherit;border:1px dashed rgba(255,230,160,.18);}
/* decor */
.beer{position:absolute;right:5px;bottom:150px;width:46px;height:70px;z-index:4;pointer-events:none;}
.coaster{position:absolute;left:8px;bottom:150px;width:74px;height:74px;border-radius:50%;z-index:4;
  background:radial-gradient(circle,#f4ead3 0 60%,#d9c9a4 61% 64%,#b3233a 65% 100%);box-shadow:0 4px 8px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a2a18;transform:rotate(-12deg);}
.coaster .t{font-size:8px;letter-spacing:1px;font-weight:700;color:#b3233a}
.coaster .tally{font-family:"Comic Sans MS",cursive;font-size:12px;line-height:1.05;text-align:center;}
/* seats */
.seat{position:absolute;z-index:3;text-align:center;}
.seat .nm{display:inline-block;font-size:12px;background:rgba(20,10,4,.75);padding:3px 9px;border-radius:10px;border:1px solid #7a5426;margin-bottom:4px;}
.seat.active .nm{background:#c99632;color:#2a1500;box-shadow:0 0 12px #f3c25a;}
.seat .fan{display:flex;justify-content:center;}
#seatTop{top:6px;left:50%;transform:translateX(-50%);}
#seatL{left:4px;top:30%;}
#seatR{right:4px;top:30%;}
#seatL .fan,#seatR .fan{flex-direction:column;align-items:center;}
.center{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;gap:26px;z-index:2;}
.pilewrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.cap{font-size:10.5px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:9px;}
.discard{position:relative;width:96px;height:134px;}
.msg{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:5;background:rgba(25,12,4,.82);
  border:1px solid #8a6230;padding:6px 14px;border-radius:16px;font-size:13px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}
.suitbadge{position:absolute;left:50%;top:calc(34% + 160px);transform:translateX(-50%);z-index:5;
  background:rgba(25,12,4,.82);border:1px solid #c99632;padding:3px 11px;border-radius:13px;font-size:12px;display:flex;align-items:center;gap:6px;}
.handwrap{flex:0 0 auto;position:relative;z-index:5;padding:0 0 12px;}
.hlabel{text-align:center;font-size:12px;margin-bottom:2px;text-shadow:0 1px 2px #000;}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:150px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;}
.hand::-webkit-scrollbar{display:none;}
.prsibtn{position:absolute;right:10px;top:-38px;z-index:6;}
/* cards */
.card{position:relative;flex:0 0 auto;transform-style:preserve-3d;transition:transform .16s;}
.cw{width:90px;height:132px;} .cw-lg{width:96px;height:134px;} .cw-sm{width:40px;height:58px;}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;overflow:hidden;box-shadow:0 8px 14px rgba(0,0,0,.55);}
.front{background:#f3ead2;}
.front svg{display:block;width:100%;height:100%;}
.back{transform:rotateY(180deg);border:2px solid #efe3c2;
  background:radial-gradient(circle at 50% 50%,#2c4f8a 0 18%,transparent 19%),
   repeating-linear-gradient(45deg,#1e3a6e 0 5px,#284a85 5px 10px);}
.back::after{content:"";position:absolute;inset:5px;border:1.5px solid #e9d9a8;border-radius:5px;}
.back.solo{transform:none;}
.card::before{content:"";position:absolute;inset:0;border-radius:8px;transform:translateZ(-3px);background:#cbbd92;}
.card.playable .front{box-shadow:0 0 0 3px #f3c25a,0 0 16px #f3c25a,0 8px 14px rgba(0,0,0,.55);}
.card.dim{filter:brightness(.6);}
.hand .card.playable:active{transform:translateY(-16px)!important;}
@keyframes dealIn{from{transform:translateY(-160px) rotateY(180deg) scale(.7);opacity:0}to{opacity:1}}
@keyframes toss{from{transform:translateY(120px) scale(.7) rotateZ(var(--rz));opacity:0}to{transform:rotateZ(var(--rz));opacity:1}}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:0}30%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
.shout{position:absolute;left:50%;top:40%;z-index:20;font-size:34px;font-weight:700;color:#ffd76a;
  text-shadow:0 0 14px #ff9d00,0 3px 3px #000;animation:pop 1.4s ease forwards;pointer-events:none;white-space:nowrap;}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,5,2,.8);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:22px;text-align:center;}
.overlay.show{display:flex;}
.overlay h2{color:#f3d48a;font-size:26px;text-shadow:0 0 10px #ff9d00;}
.overlay p{max-width:320px;line-height:1.5;font-size:15px;}
.suitpick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.sp{width:66px;height:92px;border-radius:9px;background:#f3ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px #000;}
.sp small{color:#3a2a18;font-size:11px;font-weight:700;margin-top:3px;}
.rules{font-size:12.5px;line-height:1.6;text-align:left;max-width:330px;background:rgba(255,255,255,.07);padding:12px 14px;border-radius:12px;}
.row{display:flex;gap:10px;}
</style>
</head>
<body>
<header>
  <div class="sign">🍺 U Zeleného stolu<small>HOSPODSKÉ PRŠÍ · <span id="ver">web</span></small></div>
  <div class="row"><button class="btn" id="sndBtn">🔊</button><button class="btn" id="newGame">Nová hra</button></div>
</header>
<div class="scene" id="scene">
  <div class="felt"></div>
  <div class="coaster"><div class="t">SKÓRE</div><div class="tally" id="tally"></div></div>
  <svg class="beer" viewBox="0 0 46 70">
    <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#c77d12"/><stop offset=".5" stop-color="#f2b33a"/><stop offset="1" stop-color="#b56d0c"/></linearGradient></defs>
    <path d="M6 14 L9 66 Q23 70 37 66 L40 14 Z" fill="url(#bg)" opacity=".95"/>
    <path d="M40 24 Q50 26 48 40 Q46 52 38 50" fill="none" stroke="#e8e2d0" stroke-width="4" opacity=".8"/>
    <path d="M4 15 Q8 4 16 8 Q22 1 30 7 Q40 3 42 15 Z" fill="#fbf6ea"/>
    <circle cx="16" cy="40" r="1.4" fill="#fff8" /><circle cx="26" cy="30" r="1" fill="#fff8"/><circle cx="21" cy="52" r="1.2" fill="#fff8"/>
    <path d="M6 14 L9 66 Q23 70 37 66 L40 14" fill="none" stroke="#fff6" stroke-width="1"/>
  </svg>
  <div class="seat" id="seatTop"><div class="nm" id="nm1">Pepa</div><div class="fan" id="fan1"></div></div>
  <div class="seat" id="seatL"><div class="nm" id="nm2">Franta</div><div class="fan" id="fan2"></div></div>
  <div class="msg" id="msg"></div>
  <div class="center">
    <div class="pilewrap"><div class="card cw" id="drawPile"><div class="face back solo"></div></div><div class="cap" id="drawCap">Balík</div></div>
    <div class="pilewrap"><div class="discard" id="discard"></div><div class="cap">Odhoz</div></div>
  </div>
  <div class="suitbadge" id="suitBadge" style="display:none"></div>
</div>
<div class="handwrap">
  <div class="hlabel" id="hlabel"></div>
  <div class="hand" id="hand"></div>
</div>
<div class="overlay" id="overlay"></div>
<script>
window.__errs=[];
function __showErr(t){window.__errs.push(t);var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:6px;right:6px;bottom:6px;z-index:999;background:#300;color:#fff;font:12px monospace;padding:8px;border:2px solid #f55;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto';(document.body||document.documentElement).appendChild(d);}d.textContent='CHYBA (pošli Claudovi):\n'+window.__errs.join('\n');}
window.addEventListener('error',function(e){__showErr((e.message||e)+' @'+(e.lineno||'?')+':'+(e.colno||'?'));});
window.addEventListener('unhandledrejection',function(e){__showErr('promise: '+(e.reason&&e.reason.message||e.reason));});
</script>
<script>
/* ===================== CARD ART ===================== */
const SUITS=[
 {key:'srdce', name:'Srdce', ink:'#c1272d',dark:'#7d1418',robe:'#b8322f',robe2:'#e9c24a'},
 {key:'kule',  name:'Kule',  ink:'#e0a81e',dark:'#8a6206',robe:'#d39a1c',robe2:'#3c6ea8'},
 {key:'listy', name:'Listy', ink:'#2f8a3a',dark:'#185522',robe:'#2e7d3a',robe2:'#c1272d'},
 {key:'zaludy',name:'Žaludy',ink:'#8a5a22',dark:'#4f310d',robe:'#7a4f22',robe2:'#2e7d3a'},
];
const RANKS=['7','8','9','10','J','Q','K','A'];
const RNAME={'7':'Sedma','8':'Osma','9':'Devítka','10':'Desítka','J':'Spodek','Q':'Svršek','K':'Král','A':'Eso'};
const ROM={'7':'VII','8':'VIII','9':'IX','10':'X'};
const suitOf=k=>SUITS.find(s=>s.key===k);

function sym(key,cx,cy,sz,rot=0){
 const s=suitOf(key),sc=sz/24;
 let f='';
 if(key==='srdce') f=`<path d="M12 21.5C12 21.5 2.6 15 2.6 8.8 2.6 5.4 5.1 3.4 7.6 3.4 9.4 3.4 11.1 4.5 12 6.4 12.9 4.5 14.6 3.4 16.4 3.4 18.9 3.4 21.4 5.4 21.4 8.8 21.4 15 12 21.5 12 21.5Z" fill="${s.ink}" stroke="${s.dark}" stroke-width=".8"/><path d="M6.5 7.5Q7.5 5.5 9.5 6" stroke="#fff" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>`;
 else if(key==='kule') f=`<circle cx="12" cy="3.6" r="1.6" fill="none" stroke="${s.dark}" stroke-width="1.1"/><circle cx="12" cy="13" r="8" fill="${s.ink}" stroke="${s.dark}" stroke-width=".8"/><path d="M4.4 11.5h15.2M4.4 14.5h15.2" stroke="${s.dark}" stroke-width=".9"/><path d="M8 18.5 L12 15.5 L16 18.5" stroke="${s.dark}" stroke-width="1" fill="none"/><circle cx="12" cy="19" r="1.1" fill="${s.dark}"/><path d="M7.6 8.6Q9 7 11 7" stroke="#fff" stroke-width="1.1" fill="none" opacity=".6" stroke-linecap="round"/>`;
 else if(key==='listy') f=`<path d="M12 1.8C5.5 6.5 4.2 13.5 11.2 20.3L11.2 23H12.8V20.3C19.8 13.5 18.5 6.5 12 1.8Z" fill="${s.ink}" stroke="${s.dark}" stroke-width=".8"/><path d="M12 4V20M12 9L8.5 7M12 9l3.5-2M12 13L8 10.8M12 13l4-2.2M12 16.6l-3-2M12 16.6l3-2" stroke="${s.dark}" stroke-width=".7" fill="none"/>`;
 else f=`<path d="M11.2 1.5h1.6v3h-1.6z" fill="${s.dark}"/><path d="M11 21.5Q5.6 19 6.2 11.6H17.8Q18.4 19 13 21.5Q12 22.6 11 21.5Z" fill="#c9923e" stroke="${s.dark}" stroke-width=".8"/><path d="M8.5 13.5Q9 18 11.5 20" stroke="#fff" stroke-width="1" fill="none" opacity=".45"/><path d="M4.8 11.9Q5 4.4 12 4.4Q19 4.4 19.2 11.9Z" fill="${s.ink}" stroke="${s.dark}" stroke-width=".8"/><path d="M6.5 8.5h11M6 10.4h12M8 6.7h8" stroke="${s.dark}" stroke-width=".55"/>`;
 return `<g transform="translate(${cx},${cy}) rotate(${rot}) scale(${sc}) translate(-12,-12)">${f}</g>`;
}
function frame(s,inner=true){
 let o=`<rect x="0" y="0" width="150" height="220" fill="#f4ecd6"/>`+
  `<rect x="0" y="0" width="150" height="220" fill="url(#paper)"/>`+
  `<rect x="5" y="5" width="140" height="210" rx="6" fill="none" stroke="#3a2a18" stroke-width="1.2"/>`;
 if(inner) o+=`<rect x="9" y="9" width="132" height="202" rx="4" fill="none" stroke="${s.ink}" stroke-width=".8"/>`;
 return o;
}
const DEFS=`<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#d9c79a" stop-opacity=".45"/></linearGradient></defs>`;
function flourish(x,y,c,flip=1){return `<path d="M${x} ${y} q${8*flip} -6 ${16*flip} 0 q${-8*flip} 3 ${-16*flip} 0 M${x+16*flip} ${y} q${5*flip} 0 ${7*flip} -4" stroke="${c}" stroke-width="1" fill="none"/>`;}

function pipCard(c,s){
 const n=+c.rank, L={
  7:[[50,48],[100,48],[75,82],[50,116],[100,116],[50,170],[100,170]],
  8:[[50,46],[100,46],[50,88],[100,88],[50,130],[100,130],[50,174],[100,174]],
  9:[[50,44],[100,44],[50,84],[100,84],[75,112],[50,140],[100,140],[50,178],[100,178]],
  10:[[50,44],[100,44],[75,70],[50,96],[100,96],[50,126],[100,126],[75,152],[50,180],[100,180]]}[n];
 let o=frame(s);
 L.forEach(([x,y])=>{o+=sym(c.suit,x,y,30,y>110?180:0);});
 o+=`<text x="75" y="${n===10?120:n===7?150:112}" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="${s.dark}" opacity=".0">${ROM[c.rank]}</text>`;
 o+=`<text x="16" y="24" font-family="Georgia,serif" font-weight="700" font-size="13" fill="${s.dark}">${ROM[c.rank]}</text>`;
 return o;
}

function figure(c,s){
 const k=c.rank, skin='#f0cfa4', sk2='#c99a6c';
 let o='';
 // ground
 o+=`<ellipse cx="75" cy="196" rx="44" ry="6" fill="#3a2a18" opacity=".18"/>`;
 // legs & boots
 o+=`<path d="M62 160 L60 192 L70 192 L72 160Z" fill="${k==='K'?s.robe:'#e8dfc6'}" stroke="#3a2a18" stroke-width=".8"/>`;
 o+=`<path d="M78 160 L80 192 L90 192 L88 160Z" fill="${k==='K'?s.robe:'#e8dfc6'}" stroke="#3a2a18" stroke-width=".8"/>`;
 o+=`<path d="M57 190 h14 v6 h-16z M79 190 h14 l2 6 h-16z" fill="#2a1a0c"/>`;
 // coat
 const coatLen=k==='K'?192:162;
 o+=`<path d="M56 88 Q50 120 48 ${coatLen} L102 ${coatLen} Q100 120 94 88 Q75 80 56 88Z" fill="${s.robe}" stroke="#2a1a0c" stroke-width="1"/>`;
 // coat trim / front panel
 o+=`<path d="M70 90 L68 ${coatLen} L82 ${coatLen} L80 90Z" fill="${s.robe2}" stroke="#2a1a0c" stroke-width=".7"/>`;
 for(let y=100;y<coatLen-6;y+=12) o+=`<circle cx="75" cy="${y}" r="1.6" fill="#f3d48a" stroke="#2a1a0c" stroke-width=".4"/>`;
 o+=`<path d="M48 ${coatLen} L102 ${coatLen}" stroke="#f3d48a" stroke-width="2.5"/>`;
 if(k==='K') o+=`<path d="M56 88 Q75 98 94 88 L96 96 Q75 106 54 96Z" fill="#fbf7ec" stroke="#2a1a0c" stroke-width=".7"/>`+[60,67,74,81,88].map(x=>`<circle cx="${x}" cy="${96}" r="1" fill="#2a1a0c"/>`).join('');
 // belt
 o+=`<rect x="52" y="124" width="46" height="5" fill="#2a1a0c"/><rect x="72" y="123" width="6" height="7" fill="#f3d48a" stroke="#2a1a0c" stroke-width=".5"/>`;
 // arms
 o+=`<path d="M56 90 Q44 104 46 124 L54 124 Q54 108 60 98Z" fill="${s.robe}" stroke="#2a1a0c" stroke-width=".8"/>`;
 o+=`<path d="M94 90 Q106 104 104 124 L96 124 Q96 108 90 98Z" fill="${s.robe}" stroke="#2a1a0c" stroke-width=".8"/>`;
 o+=`<circle cx="50" cy="127" r="4" fill="${skin}" stroke="${sk2}" stroke-width=".7"/><circle cx="100" cy="127" r="4" fill="${skin}" stroke="${sk2}" stroke-width=".7"/>`;
 // props
 if(k==='K'){ // scepter
  o+=`<path d="M101 127 L112 58" stroke="#b9902f" stroke-width="3"/><circle cx="112" cy="55" r="5" fill="#f3d48a" stroke="#7a5a12"/><path d="M112 47v-5M109 45h6" stroke="#7a5a12" stroke-width="1.5"/>`;
 } else if(k==='Q'){ // sword
  o+=`<path d="M101 126 L118 40" stroke="#d9dde2" stroke-width="3.4"/><path d="M101 126 L118 40" stroke="#7d8790" stroke-width=".8"/><path d="M94 120 L108 124" stroke="#7a5a12" stroke-width="3"/>`;
 } else { // halberd-ish staff
  o+=`<path d="M100 127 L104 196" stroke="#6b4a22" stroke-width="2.6"/>`;
 }
 // neck & head
 o+=`<rect x="70" y="76" width="10" height="10" fill="${skin}"/>`;
 o+=`<ellipse cx="75" cy="66" rx="12" ry="14" fill="${skin}" stroke="${sk2}" stroke-width=".8"/>`;
 // hair
 o+=`<path d="M63 64 Q62 52 75 52 Q88 52 87 64 Q86 57 75 57 Q64 57 63 64Z" fill="#6b4520"/>`;
 // face
 o+=`<path d="M68 64 q2 -1.5 4 0 M78 64 q2 -1.5 4 0" stroke="#3a2412" stroke-width="1" fill="none"/>`;
 o+=`<circle cx="70" cy="66" r="1" fill="#3a2412"/><circle cx="80" cy="66" r="1" fill="#3a2412"/>`;
 o+=`<path d="M75 66 l-1.5 5 h3" stroke="${sk2}" stroke-width=".9" fill="none"/>`;
 if(k==='K'){ o+=`<path d="M63 68 Q64 86 75 88 Q86 86 87 68 Q84 78 75 78 Q66 78 63 68Z" fill="#d8d2c4" stroke="#8a8272" stroke-width=".6"/>`; }
 else { o+=`<path d="M69 73 Q75 70 81 73 Q75 75 69 73Z" fill="#5a3818"/>`; }
 o+=`<path d="M72 76.5 q3 1.5 6 0" stroke="#9c5a40" stroke-width=".9" fill="none"/>`;
 o+=`<circle cx="68" cy="70" r="2" fill="#e89a8a" opacity=".45"/><circle cx="82" cy="70" r="2" fill="#e89a8a" opacity=".45"/>`;
 // headwear
 if(k==='K') o+=`<path d="M61 56 L60 40 L67 48 L75 36 L83 48 L90 40 L89 56Z" fill="#f3c94a" stroke="#7a5a12" stroke-width="1"/><rect x="60" y="53" width="30" height="5" fill="#d4a62a" stroke="#7a5a12" stroke-width=".7"/><circle cx="75" cy="44" r="2" fill="#c1272d"/><circle cx="66" cy="55.5" r="1.3" fill="#2f6ab0"/><circle cx="84" cy="55.5" r="1.3" fill="#2f8a3a"/>`;
 else if(k==='Q') o+=`<path d="M58 58 Q60 44 75 44 Q92 44 94 56 Q80 52 58 58Z" fill="${s.robe2}" stroke="#2a1a0c" stroke-width=".8"/><path d="M86 48 Q104 30 98 50 Q108 38 96 56" fill="#fbf7ec" stroke="#6b6355" stroke-width=".7"/>`;
 else o+=`<path d="M61 58 Q62 46 75 46 Q88 46 89 58 L91 60 L59 60Z" fill="#3c3a52" stroke="#1a1a24" stroke-width=".8"/><path d="M59 60 h32" stroke="#f3d48a" stroke-width="1.4"/>`;
 // suit emblem: Svršek high, Spodek low, Král on chest
 if(k==='Q') o+=sym(c.suit,38,40,30);
 else if(k==='J') o+=sym(c.suit,40,176,30);
 else o+=sym(c.suit,40,40,24);
 o+=sym(c.suit,50,127,16); // held in hand
 return o;
}
function courtCard(c,s){
 let o=frame(s);
 o+=`<rect x="13" y="13" width="124" height="194" rx="3" fill="${s.ink}" opacity=".06"/>`;
 o+=figure(c,s);
 o+=`<path d="M30 206 h90" stroke="${s.ink}" stroke-width=".6"/>`;
 o+=`<text x="75" y="214" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="9" fill="#3a2a18" letter-spacing="1">${RNAME[c.rank].toUpperCase()}</text>`;
 return o;
}
function aceCard(c,s){
 let o=frame(s);
 o+=`<circle cx="75" cy="104" r="54" fill="${s.ink}" opacity=".07"/>`;
 o+=`<circle cx="75" cy="104" r="54" fill="none" stroke="#3a2a18" stroke-width=".8"/>`;
 // laurel
 for(let i=0;i<9;i++){const a=(200+i*16)*Math.PI/180, b=(-20-i*16)*Math.PI/180;
  o+=`<ellipse cx="${75+60*Math.cos(a)}" cy="${104+60*Math.sin(a)*-1}" rx="5" ry="2.2" fill="#2f8a3a" transform="rotate(${-(200+i*16)+90} ${75+60*Math.cos(a)} ${104+60*Math.sin(a)*-1})"/>`;
  o+=`<ellipse cx="${75+60*Math.cos(b)}" cy="${104+60*Math.sin(b)*-1}" rx="5" ry="2.2" fill="#2f8a3a" transform="rotate(${-(-20-i*16)+90} ${75+60*Math.cos(b)} ${104+60*Math.sin(b)*-1})"/>`;}
 o+=sym(c.suit,75,102,86);
 o+=`<path d="M30 178 Q75 168 120 178 L116 194 Q75 184 34 194Z" fill="#fbf4e0" stroke="#3a2a18" stroke-width=".9"/>`;
 o+=`<text x="75" y="188" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="${s.dark}" letter-spacing="3">ESO</text>`;
 o+=flourish(22,30,s.ink)+flourish(128,30,s.ink,-1);
 return o;
}
const IMG={}; // real card photos: assets/cards/<suit>_<rank>.jpg (e.g. srdce_7.jpg, kule_Q.jpg)
function probe(){SUITS.forEach(s=>RANKS.forEach(r=>{IMG[s.key+r]=`cards/${s.key}_${r}.jpg`;const i=new Image();i.src=IMG[s.key+r];}));}
const CACHE={};
function cardSVG(c){
 if(IMG[c.suit+c.rank]) return `<img src="${IMG[c.suit+c.rank]}" style="width:100%;height:100%;object-fit:cover;display:block">`;
 const id=c.suit+c.rank; if(CACHE[id])return CACHE[id];
 const s=suitOf(c.suit);
 let b=['7','8','9','10'].includes(c.rank)?pipCard(c,s):c.rank==='A'?aceCard(c,s):courtCard(c,s);
 return CACHE[id]=`<svg viewBox="0 0 150 220" xmlns="http://www.w3.org/2000/svg">${DEFS}${b}</svg>`;
}
/* ===================== SOUND ===================== */
let AC=null,SND=true;
function snd(type){ if(!SND)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const t=AC.currentTime, n=AC.createBufferSource(), len=type==='slap'?0.09:0.05;
 const buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
 for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,type==='slap'?3:5);
 n.buffer=buf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=type==='slap'?1400:2600;
 const g=AC.createGain(); g.gain.value=type==='slap'?0.9:0.5; n.connect(f).connect(g).connect(AC.destination); n.start(t);
 if(type==='win'){[523,659,784,1046].forEach((fr,i)=>{const o=AC.createOscillator(),gg=AC.createGain();o.type='triangle';o.frequency.value=fr;
  gg.gain.setValueAtTime(.0001,t+i*.12);gg.gain.exponentialRampToValueAtTime(.25,t+i*.12+.02);gg.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.4);o.connect(gg).connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.45);});}
 }catch(e){} }
/* ===================== GAME ===================== */
const $=id=>document.getElementById(id);
const PL=[{name:'Ty',hand:[],ai:false},{name:'Pepa',hand:[],ai:true},{name:'Franta',hand:[],ai:true}];
let deck,discard,topSuit,penalty,aceStop,cur,locked,score=[0,0,0];
try{score=JSON.parse(localStorage.getItem('prsiScore'))||score;}catch(e){}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(n){const o=[];for(let i=0;i<n;i++){if(!deck.length){const t=discard.pop();deck=shuffle(discard);discard=[t];}if(!deck.length)break;o.push(deck.pop());}return o;}
const topCard=()=>discard[discard.length-1];
function newGame(){
 deck=shuffle(SUITS.flatMap(s=>RANKS.map(r=>({suit:s.key,rank:r}))));discard=[];penalty=0;aceStop=false;
 PL.forEach(p=>p.hand=draw(4));
 let f=draw(1)[0];while(f.rank==='Q'){deck.unshift(f);f=draw(1)[0];}
 discard=[f];topSuit=f.suit;cur=0;locked=false;
 // starting card effects apply to first player
 if(f.rank==='7')penalty=2; if(f.rank==='A')aceStop=true;
 closeOv();render(true);snd('flick');turnStart();
}
function canPlay(c){
 if(aceStop) return c.rank==='A';
 if(penalty>0) return c.rank==='7';
 if(c.rank==='Q') return true;
 return c.suit===topSuit||c.rank===topCard().rank;
}
const hasMove=p=>p.hand.some(canPlay);
function shout(t){const d=document.createElement('div');d.className='shout';d.textContent=t;$('scene').appendChild(d);setTimeout(()=>d.remove(),1400);}
const setMsg=t=>$('msg').textContent=t;
function cardEl(c,cls='cw',ok=false,dim=false){
 const e=document.createElement('div');e.className=`card ${cls}${ok?' playable':''}${dim?' dim':''}`;
 e.innerHTML=`<div class="face front">${cardSVG(c)}</div><div class="face back"></div>`;return e;}
function backEl(i,n,side){const e=document.createElement('div');e.className='card cw-sm';e.innerHTML='<div class="face back solo"></div>';
 const off=i-(n-1)/2;
 if(side==='top'){e.style.marginLeft=i?'-24px':'0';e.style.transform=`rotate(${180+off*4}deg)`;}
 else{e.style.marginTop=i?'-44px':'0';e.style.transform=`rotate(${(side==='L'?90:-90)+off*4}deg)`;}
 return e;}
function render(dealt=false){
 // opponents
 [[1,'fan1','top'],[2,'fan2','L']].forEach(([pi,id,side])=>{
  const f=$(id);f.innerHTML='';const n=PL[pi].hand.length;
  for(let i=0;i<n;i++){const b=backEl(i,n,side);if(dealt)b.style.animation=`dealIn .35s ease ${i*.05}s both`;f.appendChild(b);}
  $('nm'+pi).textContent=`${PL[pi].name} · ${n}`;
  $('nm'+pi).parentElement.classList.toggle('active',cur===pi);
 });
 // discard
 const dz=$('discard');dz.innerHTML='';
 discard.slice(-5).forEach((c,i,a)=>{const e=cardEl(c,'cw-lg');e.style.position='absolute';
  const rz=((c.suit.length*13+c.rank.charCodeAt(0)*7+i*29)%24)-12;e.style.setProperty('--rz',rz+'deg');
  e.style.transform=`rotateZ(${rz}deg)`;if(i===a.length-1)e.style.animation='toss .28s ease-out both';dz.appendChild(e);});
 const sb=$('suitBadge');
 if(topSuit!==topCard().suit||topCard().rank==='Q'){sb.style.display='flex';sb.innerHTML=`Hraje se: <b>${suitOf(topSuit).name}</b><svg width="18" height="18" viewBox="0 0 24 24">${sym(topSuit,12,12,22)}</svg>`;}
 else sb.style.display='none';
 $('drawCap').textContent=penalty?`Líznout ${penalty}`:aceStop?'Stůj!':`Balík · ${deck.length}`;
 // my hand
 const h=$('hand');h.innerHTML='';const me=PL[0],my=cur===0&&!locked,mv=hasMove(me),n=me.hand.length;
 me.hand.forEach((c,i)=>{const ok=my&&canPlay(c);const e=cardEl(c,'cw',ok,my&&!ok);
  const off=i-(n-1)/2;e.style.marginLeft=i?(n>7?'-46px':'-30px'):'0';
  e.style.transform=`rotateZ(${off*3}deg) translateY(${Math.abs(off)*off*0+Math.abs(off)*4}px)`;
  if(dealt)e.style.animation=`dealIn .4s ease ${.15+i*.07}s both`;
  if(ok)e.onclick=()=>play(0,i);h.appendChild(e);});
 $('hlabel').textContent=my?(mv?'Tvůj tah — zahraj zvýrazněnou kartu':(aceStop?'Eso! Nemáš eso — ťukni na balík (stojíš)':penalty?`Sedma! Ťukni na balík, bereš ${penalty}`:'Nemáš co dát — ťukni na balík')):`Hraje ${PL[cur].name}…`;
 $('tally').innerHTML=PL.map((p,i)=>`${p.name}: ${'|'.repeat(Math.min(score[i],9))||'–'}`).join('<br>');
}
function next(){cur=(cur+1)%PL.length;}
function turnStart(){
 render();
 const p=PL[cur];
 if(p.ai){locked=true;setTimeout(aiMove,800+Math.random()*500);}
 else{locked=false;setMsg(hasMove(p)?'Jsi na tahu.':aceStop?'Na tebe padlo eso…':penalty?`Sedma! Bereš ${penalty}, nebo přebij sedmou.`:'Nemáš co přiložit.');render();}
}
function play(pi,idx){
 const p=PL[pi],c=p.hand[idx];if(!canPlay(c))return;
 if(pi===0&&locked)return;
 p.hand.splice(idx,1);discard.push(c);topSuit=c.suit;snd('slap');
 if(c.rank==='7'){penalty+=2;shout(penalty>2?`Sedma! (${penalty})`:'Sedma!');}
 if(c.rank==='A'){aceStop=true;shout('Eso – stůj!');}
 if(p.hand.length===1)setTimeout(()=>shout(`${p.name==='Ty'?'Máš':p.name+' má'} poslední!`),300);
 setMsg(`${p.name==='Ty'?'Zahrál jsi':p.name+' zahrál'} ${RNAME[c.rank].toLowerCase()} – ${suitOf(c.suit).name.toLowerCase()}.`);
 if(c.rank==='Q'){
  if(p.ai){topSuit=aiSuit(p);shout(`Mění na ${suitOf(topSuit).name}!`);}
  else{render();return askSuit();}
 }
 after(pi);
}
function after(pi){
 render();
 if(PL[pi].hand.length===0)return end(pi);
 next();setTimeout(turnStart,pi===0?350:550);
}
function pass(pi){ // draw / stand
 const p=PL[pi];
 if(aceStop){aceStop=false;setMsg(`${p.name==='Ty'?'Stojíš':p.name+' stojí'}.`);snd('flick');}
 else if(penalty){p.hand.push(...draw(penalty));setMsg(`${p.name==='Ty'?'Bereš':p.name+' bere'} ${penalty}.`);penalty=0;snd('flick');}
 else{p.hand.push(...draw(1));setMsg(`${p.name==='Ty'?'Líznul sis':p.name+' si líznul'}.`);snd('flick');}
 render();next();setTimeout(turnStart,450);
}
$('drawPile').onclick=()=>{if(cur!==0||locked)return;locked=true;pass(0);};
function askSuit(){
 const o=$('overlay');o.innerHTML='<h2>Svršek!</h2><p>Na jakou barvu měníš?</p>';
 const d=document.createElement('div');d.className='suitpick';
 SUITS.forEach(s=>{const b=document.createElement('div');b.className='sp';
  b.innerHTML=`<svg width="44" height="44" viewBox="0 0 24 24">${sym(s.key,12,12,22)}</svg><small>${s.name}</small>`;
  b.onclick=()=>{topSuit=s.key;closeOv();shout(`Na ${s.name}!`);after(0);};d.appendChild(b);});
 o.appendChild(d);o.classList.add('show');
}
function aiSuit(p){const c={};SUITS.forEach(s=>c[s.key]=0);p.hand.forEach(k=>{if(k.rank!=='Q')c[k.suit]++;});
 return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];}
function aiMove(){
 const p=PL[cur],pi=cur;
 const opts=p.hand.map((c,i)=>({c,i})).filter(o=>canPlay(o.c));
 if(!opts.length)return pass(pi);
 const nextN=PL[(pi+1)%3].hand.length;
 const score=o=>{const r=o.c.rank;let v=0;
  if(r==='7')v=nextN<=2?9:5; else if(r==='A')v=nextN<=2?8:4; else if(r==='Q')v=-3+(p.hand.length<=2?8:0); else v=2;
  v+=p.hand.filter(k=>k.suit===o.c.suit).length*.6; return v+Math.random();};
 opts.sort((a,b)=>score(b)-score(a));
 play(pi,opts[0].i);
}
function end(w){
 locked=true;score[w]++;try{localStorage.setItem('prsiScore',JSON.stringify(score));}catch(e){}
 render();snd('win');
 const o=$('overlay');const me=w===0;
 o.innerHTML=`<h2>${me?'🍺 Prší! Vyhrál jsi!':`${PL[w].name} vyhrál`}</h2><p>${me?'Hospoda tleská. Další rundu platí Pepa.':'Nevadí, dej si další pivo a odvetu.'}</p>`;
 const b=document.createElement('button');b.className='btn';b.style.fontSize='16px';b.style.padding='12px 22px';b.textContent='Další runda';b.onclick=newGame;o.appendChild(b);
 const r=document.createElement('div');r.className='rules';
 r.innerHTML='<b>Hospodská pravidla</b><br>• Přikládá se barva nebo hodnota.<br>• <b>Sedma</b> – další bere 2, sedmy se sčítají (přebiješ sedmou).<br>• <b>Eso</b> – další stojí, pokud nedá taky eso.<br>• <b>Svršek</b> – na cokoli (kromě na sedmu/eso v akci), mění barvu.<br>• Kdo se první zbaví karet, vyhrál.';
 o.appendChild(r);
 const cr=document.createElement('div');cr.style.cssText='font-size:10px;opacity:.6;max-width:320px';cr.innerHTML='Karty: „Bohemian pattern“, foto Countakeshi, Wikimedia Commons, licence CC BY-SA 4.0 (oříznuto a upraveno).';o.appendChild(cr);o.classList.add('show');
}
const closeOv=()=>$('overlay').classList.remove('show');
$('newGame').onclick=newGame;
$('sndBtn').onclick=()=>{SND=!SND;$('sndBtn').textContent=SND?'🔊':'🔇';};
try{var _v=new URLSearchParams(location.search).get('v');if(_v)document.getElementById('ver').textContent='v'+_v;}catch(e){}
probe();newGame();
</script>
