name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot and Android export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $tdir
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt' -d $tdir
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          ls -la $tdir

      - name: Godot editor settings (Android SDK + Java)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import assets
        run: ./godot --headless --path game --import || true

      - name: Rules self-test
        run: ./godot --headless --path game --script res://tests/test_rules.gd | tee test.log && grep -q RULES_OK test.log

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/keys/prsi.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p game/build
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"2.${GITHUB_RUN_NUMBER}\"/" game/export_presets.cfg
          ./godot --headless --path game --export-release "Android" build/prsi.apk
          ls -la game/build
          test -s game/build/prsi.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prsi-apk
          path: game/build/prsi.apk
          if-no-files-found: error

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Prší – nejnovější verze
          body: Hospodské Prší v enginu Godot – instalovatelné APK (stáhni prsi.apk). Hra s počítačem i přes Wi-Fi.
          files: game/build/prsi.apk
          make_latest: true
